name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package-lock.json"
      - "tools/sync-android.mjs"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # The APK carries the whole front end. `webassets/` is generated and never
      # committed, so without this step the app would ship with no pages in it.
      - name: Build and bundle the site
        run: |
          npm ci
          npm run build:app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: changshengtian-app
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
